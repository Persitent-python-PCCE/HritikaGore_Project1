<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{{ error_code }} - {{ error_title }}</title>

    <script>
      (function () {
        const stored = localStorage.getItem("lms-theme");

        const theme =
          stored ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");

        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>

    <style>
      /* =====================================================
           THEME VARIABLES
           ===================================================== */

      :root {
        --bg: #f5f7fb;
        --card: #ffffff;
        --text: #172033;
        --muted: #667085;
        --border: #e5e7eb;
        --primary: #4f46e5;
        --primary-hover: #4338ca;
        --secondary: #eef0f4;
        --secondary-hover: #e2e5eb;
      }

      [data-theme="dark"] {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f8fafc;
        --muted: #cbd5e1;
        --border: #334155;
        --primary: #6366f1;
        --primary-hover: #818cf8;
        --secondary: #334155;
        --secondary-hover: #475569;
      }

      /* =====================================================
           RESET
           ===================================================== */

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }

      /* =====================================================
           BODY
           ===================================================== */

      body {
        min-height: 100vh;

        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Arial,
          sans-serif;

        background: var(--bg);
        color: var(--text);

        transition:
          background 0.2s ease,
          color 0.2s ease;
      }

      /* =====================================================
           ERROR PAGE
           ===================================================== */

      .error-page {
        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 30px 20px;
      }

      /* =====================================================
           ERROR CARD
           ===================================================== */

      .error-card {
        width: 100%;
        max-width: 560px;

        padding: 50px 40px;

        text-align: center;

        background: var(--card);

        border: 1px solid var(--border);

        border-radius: 20px;

        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);

        animation: errorCardIn 0.3s ease-out;
      }

      /* =====================================================
           ERROR ICON
           ===================================================== */

      .error-icon {
        width: 76px;
        height: 76px;

        margin: 0 auto 22px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 50%;

        background: rgba(239, 68, 68, 0.1);

        font-size: 38px;
      }

      /* =====================================================
           ERROR CODE
           ===================================================== */

      .error-code {
        margin-bottom: 8px;

        font-size: 64px;
        font-weight: 800;

        line-height: 1;

        letter-spacing: -2px;

        color: var(--primary);
      }

      /* =====================================================
           TITLE
           ===================================================== */

      .error-card h1 {
        margin: 0 0 14px;

        font-size: 30px;
        font-weight: 700;

        color: var(--text);
      }

      /* =====================================================
           MESSAGE
           ===================================================== */

      .error-card p {
        max-width: 430px;

        margin: 0 auto 32px;

        font-size: 16px;
        line-height: 1.6;

        color: var(--muted);
      }

      /* =====================================================
           BUTTONS
           ===================================================== */

      .error-actions {
        display: flex;

        justify-content: center;

        gap: 12px;

        flex-wrap: wrap;
      }

      .error-btn {
        display: inline-flex;

        align-items: center;
        justify-content: center;

        min-width: 140px;

        padding: 12px 20px;

        border-radius: 10px;

        border: 1px solid transparent;

        text-decoration: none;

        font-size: 14px;
        font-weight: 600;

        cursor: pointer;

        transition:
          background 0.2s ease,
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      .error-btn:hover {
        transform: translateY(-1px);
      }

      /* Primary */

      .error-btn.primary {
        background: var(--primary);
        color: white;

        box-shadow: 0 5px 15px rgba(79, 70, 229, 0.25);
      }

      .error-btn.primary:hover {
        background: var(--primary-hover);
      }

      /* Secondary */

      .error-btn.secondary {
        background: var(--secondary);
        color: var(--text);

        border-color: var(--border);
      }

      .error-btn.secondary:hover {
        background: var(--secondary-hover);
      }

      /* =====================================================
           ANIMATION
           ===================================================== */

      @keyframes errorCardIn {
        from {
          opacity: 0;
          transform: translateY(15px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* =====================================================
           MOBILE
           ===================================================== */

      @media (max-width: 600px) {
        .error-page {
          padding: 20px 15px;
        }

        .error-card {
          padding: 40px 24px;
        }

        .error-code {
          font-size: 54px;
        }

        .error-card h1 {
          font-size: 25px;
        }

        .error-card p {
          font-size: 15px;
        }

        .error-actions {
          flex-direction: column;
        }

        .error-btn {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <main class="error-page">
      <section class="error-card">
        <div class="error-icon">⚠️</div>

        <div class="error-code">{{ error_code }}</div>

        <h1>{{ error_title }}</h1>

        <p>{{ error_message }}</p>

        <div class="error-actions">
          <a
            href="{{ url_for('course_controller.courses') }}"
            class="error-btn primary"
          >
            Back to Courses
          </a>

          <a href="javascript:history.back()" class="error-btn secondary">
            Go Back
          </a>
        </div>
      </section>
    </main>

    <script>
      // Keep the LMS theme switcher working if theme.js exists.
      const themeScript = document.createElement("script");
      themeScript.src = "{{ url_for('static', filename='js/theme.js') }}";
      document.body.appendChild(themeScript);
    </script>
  </body>
</html>
